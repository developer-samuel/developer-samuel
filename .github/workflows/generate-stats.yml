name: 📊 Generate profile stats

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: developer-samuel/github-stats-generator@52fdd0c865dfae287bf77c0ca9b59ec0d2befe9c # v1.0.0
        with:
          token: ${{ secrets.STATS_TOKEN }}
          username: developer-samuel
          start_date: '2017-09-01'
          theme: dark
          primary_color: '#01FF5E'
          stats_file: assets/stats.svg
          metrics_file: assets/metrics.svg

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet assets/stats.svg assets/metrics.svg || (
            git add assets/stats.svg assets/metrics.svg &&
            git commit -m "chore: update profile stats" &&
            git push
          )
