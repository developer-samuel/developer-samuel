name: 📊 Generate profile stats

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: developer-samuel/github-stats-generator@08078d19259b6b64d15ebfcb83308a3ca783881c # v1.1.0
        with:
          token: ${{ secrets.STATS_TOKEN }}
          username: developer-samuel
          start_date: '2017-09-01'
          theme: dark
          primary_color: '#01FF5E'
          output_dir: assets
          readme_path: README.md

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ README.md
          git diff --cached --quiet || (
            git commit -m "chore: update profile stats" &&
            git push
          )
