<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 80" width="100%" style="overflow:hidden">
  <defs>
    <style>      @keyframes role {
        0%     { transform: translateY(36px); opacity: 0; }
        5.56%  { transform: translateY(0px);  opacity: 1; }
        13.89% { transform: translateY(0px);  opacity: 1; }
        16.67% { transform: translateY(-36px); opacity: 0; }
        100%   { transform: translateY(-36px); opacity: 0; }
      }

      .role {
        font-family: 'Courier New', Courier, monospace;
        font-weight: bold;
        font-size: 36px;
        fill: #01FF5E;
        animation: role 18s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        transform-box: fill-box;
        transform-origin: center;
        will-change: transform;
        opacity: 0;
      }

      .r1 { animation-delay:   0s; }
      .r2 { animation-delay: -15s; }
      .r3 { animation-delay: -12s; }
      .r4 { animation-delay:  -9s; }
      .r5 { animation-delay:  -6s; }
      .r6 { animation-delay:  -3s; }
    </style>
  </defs>

  <rect width="640" height="80" fill="none"/>

  <g>
    <text class="role r1" x="320" y="52" text-anchor="middle">Backend Engineer</text>
    <text class="role r2" x="320" y="52" text-anchor="middle">Platform Engineer</text>
    <text class="role r3" x="320" y="52" text-anchor="middle">AI Integration</text>
    <text class="role r4" x="320" y="52" text-anchor="middle">DevSecOps Engineer</text>
    <text class="role r5" x="320" y="52" text-anchor="middle">Open-Source Contributor</text>
    <text class="role r6" x="320" y="52" text-anchor="middle">Freelancer</text>
  </g>
</svg>
