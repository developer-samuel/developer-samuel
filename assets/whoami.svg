<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 88" width="100%">
  <defs>
    <style>
      .mono { font-family: 'Courier New', Courier, monospace; }
      @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
      .o1 { animation: fadein 0.1s ease forwards; animation-delay: 0.2s; opacity: 0; }
      .o2 { animation: fadein 0.1s ease forwards; animation-delay: 0.4s; opacity: 0; }
      .o3 { animation: fadein 0.1s ease forwards; animation-delay: 0.6s; opacity: 0; }
