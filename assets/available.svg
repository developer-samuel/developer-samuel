<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 80" width="100%">
  <defs>
    <style>
      @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
      .a1 { animation: fadein 0.4s ease forwards; animation-delay: 0.1s; opacity: 0; }
      .a2 { animation: fadein 0.4s ease forwards; animation-delay: 0.4s; opacity: 0; }
      .a3 { animation: fadein 0.4s ease forwards; animation-delay: 0.7s; opacity: 0; }
    </style>
  </defs>

  <rect width="820" height="80" fill="#0d1117"/>

  <text font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold"
        x="410" text-anchor="middle">
    <tspan class="a1" y="26" fill="#e6edf3">Freelance • Contracts • Full-time</tspan>
  </text>

  <text font-family="'Courier New', Courier, monospace" font-size="13"
        x="410" text-anchor="middle">
    <tspan class="a2" y="50" fill="#e6edf3">Slovakia | EU | Remote</tspan>
  </text>

  <text font-family="'Courier New', Courier, monospace" font-size="12"
        x="410" text-anchor="middle">
    <tspan class="a3" y="70" fill="#484f58">Average response time - 48h</tspan>
  </text>
</svg>
