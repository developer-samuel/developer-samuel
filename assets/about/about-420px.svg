<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 262" width="100%">
  <defs>
    <style>
      .dim2 { fill: #8b949e; }
      .hi   { fill: #01FF5E; }
      .neu  { fill: #e6edf3; }
      @media (prefers-color-scheme: light) {
        .dim2 { fill: #57606a; }
        .hi   { fill: #1a7f37; }
        .neu  { fill: #1f2328; }
      }
      .mono { font-family: 'Courier New', Courier, monospace; }

      @keyframes tw1  { to { width: 379px; } }
      @keyframes tw2  { to { width: 379px; } }
      @keyframes tw3  { to { width: 353px; } }
      @keyframes tw4  { to { width: 379px; } }
      @keyframes tw5  { to { width: 370px; } }
      @keyframes tw6  { to { width: 353px; } }
      @keyframes tw7  { to { width: 396px; } }
      @keyframes tw8  { to { width: 353px; } }
      @keyframes tw9  { to { width: 361px; } }
      @keyframes tw10 { to { width: 353px; } }
      @keyframes tw11 { to { width: 318px; } }
      @keyframes tw12 { to { width: 395px; } }
      @keyframes tw13 { to { width: 336px; } }
      @keyframes tw14 { to { width: 344px; } }
      @keyframes tw15 { to { width: 326px; } }

      .tw1  { width: 0; animation: tw1  1.05s linear forwards; animation-delay: 0.2s;  }
      .tw2  { width: 0; animation: tw2  1.05s linear forwards; animation-delay: 0.35s; }
      .tw3  { width: 0; animation: tw3  1.0s  linear forwards; animation-delay: 0.5s;  }
      .tw4  { width: 0; animation: tw4  1.05s linear forwards; animation-delay: 0.65s; }
      .tw5  { width: 0; animation: tw5  1.05s linear forwards; animation-delay: 0.8s;  }
      .tw6  { width: 0; animation: tw6  1.0s  linear forwards; animation-delay: 0.95s; }
      .tw7  { width: 0; animation: tw7  1.1s  linear forwards; animation-delay: 1.1s;  }
      .tw8  { width: 0; animation: tw8  1.0s  linear forwards; animation-delay: 1.25s; }
      .tw9  { width: 0; animation: tw9  1.0s  linear forwards; animation-delay: 2.4s;  }
      .tw10 { width: 0; animation: tw10 1.0s  linear forwards; animation-delay: 2.55s; }
      .tw11 { width: 0; animation: tw11 0.9s  linear forwards; animation-delay: 2.7s;  }
      .tw12 { width: 0; animation: tw12 1.0s  linear forwards; animation-delay: 3.7s;  }
      .tw13 { width: 0; animation: tw13 0.95s linear forwards; animation-delay: 3.85s; }
      .tw14 { width: 0; animation: tw14 1.0s  linear forwards; animation-delay: 4.0s;  }
      .tw15 { width: 0; animation: tw15 0.95s linear forwards; animation-delay: 4.15s; }
    </style>

    <clipPath id="c1" ><rect class="tw1"  x="6" y="6"   height="16"/></clipPath>
    <clipPath id="c2" ><rect class="tw2"  x="6" y="22"  height="16"/></clipPath>
    <clipPath id="c3" ><rect class="tw3"  x="6" y="38"  height="16"/></clipPath>
    <clipPath id="c4" ><rect class="tw4"  x="6" y="54"  height="16"/></clipPath>
    <clipPath id="c5" ><rect class="tw5"  x="6" y="70"  height="16"/></clipPath>
    <clipPath id="c6" ><rect class="tw6"  x="6" y="86"  height="16"/></clipPath>
    <clipPath id="c7" ><rect class="tw7"  x="6" y="102" height="16"/></clipPath>
    <clipPath id="c8" ><rect class="tw8"  x="6" y="118" height="16"/></clipPath>
    <clipPath id="c9" ><rect class="tw9"  x="6" y="140" height="16"/></clipPath>
    <clipPath id="c10"><rect class="tw10" x="6" y="156" height="16"/></clipPath>
    <clipPath id="c11"><rect class="tw11" x="6" y="172" height="16"/></clipPath>
    <clipPath id="c12"><rect class="tw12" x="6" y="194" height="16"/></clipPath>
    <clipPath id="c13"><rect class="tw13" x="6" y="210" height="16"/></clipPath>
    <clipPath id="c14"><rect class="tw14" x="6" y="226" height="16"/></clipPath>
    <clipPath id="c15"><rect class="tw15" x="6" y="242" height="18"/></clipPath>
  </defs>

  <rect width="420" height="262" fill="none"/>

  <!-- paragraph 1 -->
  <text class="mono" x="6" y="18" font-size="13" clip-path="url(#c1)">
    <tspan class="dim2">Developer since </tspan><tspan class="neu">2017</tspan><tspan class="dim2">, focusing on full-stack</tspan>
  </text>
  <text class="mono" x="6" y="34" font-size="13" clip-path="url(#c2)">
    <tspan class="dim2">engineering since </tspan><tspan class="neu">2019</tspan><tspan class="dim2"> - shipping production</tspan>
  </text>
  <text class="mono" x="6" y="50" font-size="13" clip-path="url(#c3)">
    <tspan class="dim2">systems since </tspan><tspan class="neu">2022</tspan><tspan class="dim2">, lately expanding into</tspan>
  </text>
  <text class="mono" x="6" y="66" font-size="13" clip-path="url(#c4)">
    <tspan class="hi">Platform Engineering, DevOps,</tspan><tspan class="dim2"> and </tspan><tspan class="hi">DevSecOps:</tspan>
  </text>
  <text class="mono" x="6" y="82" font-size="13" clip-path="url(#c5)">
    <tspan class="hi">Kubernetes, GitOps, IaC, security scanning,</tspan>
  </text>
  <text class="mono" x="6" y="98" font-size="13" clip-path="url(#c6)">
    <tspan class="dim2">and </tspan><tspan class="hi">AI-powered systems</tspan><tspan class="dim2">. Background across</tspan>
  </text>
  <text class="mono" x="6" y="114" font-size="13" clip-path="url(#c7)">
    <tspan class="dim2">e-commerce platforms, financial and investment</tspan>
  </text>
  <text class="mono" x="6" y="130" font-size="13" clip-path="url(#c8)">
    <tspan class="dim2">systems, and field technician schedulers.</tspan>
  </text>

  <!-- paragraph 2 -->
  <text class="mono" x="6" y="152" font-size="13" clip-path="url(#c9)">
    <tspan class="dim2">I care about architecture that ages well -</tspan>
  </text>
  <text class="mono" x="6" y="168" font-size="13" clip-path="url(#c10)">
    <tspan class="hi">Hexagonal DDD</tspan><tspan class="dim2">, clear boundaries, code the</tspan>
  </text>
  <text class="mono" x="6" y="184" font-size="13" clip-path="url(#c11)">
    <tspan class="dim2">next engineer can actually work with.</tspan>
  </text>

  <!-- paragraph 3 -->
  <text class="mono" x="6" y="206" font-size="13" clip-path="url(#c12)">
    <tspan class="dim2">Looking for someone who can own the full stack</tspan>
  </text>
  <text class="mono" x="6" y="222" font-size="13" clip-path="url(#c13)">
    <tspan class="dim2">end-to-end - architecture, delivery, and</tspan>
  </text>
  <text class="mono" x="6" y="238" font-size="13" clip-path="url(#c14)">
    <tspan class="dim2">everything in between? That&apos;s what I do.</tspan>
  </text>
  <text class="mono" x="6" y="254" font-size="13" clip-path="url(#c15)">
    <tspan class="dim2">That&apos;s exactly what I do. </tspan><tspan class="hi">Let&apos;s talk.</tspan>
  </text>
</svg>
